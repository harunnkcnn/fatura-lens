name: Bug report / Hata bildirimi
description: A document is read wrong, a check misfires, or something breaks.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach real invoices.** Replace names, VKN/TCKN, addresses and amounts before sharing any XML.
        **Gerçek fatura eklemeyin.** XML paylaşmadan önce isim, VKN/TCKN, adres ve tutarları değiştirin.
  - type: textarea
    id: what
    attributes:
      label: What happened? / Ne oldu?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? / Ne bekliyordunuz?
  - type: input
    id: doc
    attributes:
      label: Document type / Belge türü
      placeholder: e.g. TICARIFATURA / TEVKIFAT, TEMELIRSALIYE / SEVK
  - type: input
    id: browser
    attributes:
      label: Browser and OS / Tarayıcı ve işletim sistemi
  - type: textarea
    id: xml
    attributes:
      label: Anonymized XML excerpt / Anonimleştirilmiş XML parçası
      render: xml
